# The tools topos is developed and tested with. CI installs them from this file (jdx/mise-action),
# so a local shell and a CI job run the same versions. Python dependencies are in pyproject.toml
# and uv.lock; uv manages those, not mise.
[tools]
# At or above the floor that `requires-python` and ruff's `target-version` state (PY-VER-1).
python = "3.13.18"
uv = "0.13.9"

[settings]
# SC-IN-1: a new tool release waits a week before mise will install it.
minimum_release_age = "7d"

[env]
# uv uses the Python above rather than downloading its own.
UV_PYTHON_DOWNLOADS = "never"
