[project]
name = "topos"
description = "State what a system allows, and check it against what was intended."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "pglast>=8.9,<9",
    "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<10", "jsonschema>=4.26,<5"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "topos.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
