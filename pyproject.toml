[project]
name = "topos"
description = "State what a system allows, and check it against what was intended."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "pglast>=8.9,<9",
    "psycopg[binary]>=3.3,<4",
    "networkx>=3.7,<4",
]

# Development dependencies, resolved into uv.lock. `uv sync` installs `dev`, which is every group.
[dependency-groups]
test = ["pytest>=9.2,<10", "jsonschema>=4.26,<5"]
lint = ["ruff==0.16.9"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "topos.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# SC-IN-1: resolve only releases at least a week old, matching Dependabot's cooldown.
exclude-newer = "7 days"
# The lock covers Python 3.12 and later only: networkx 3.7, the floor of its range above, requires
# 3.12, so no 3.11 environment can install topos as declared. Whether to raise `requires-python`
# (and ruff's target-version with it, PY-VER-1) or widen the networkx range is not decided here.
environments = ["python_version >= '3.12'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
