# Dependency updates for this repository (SC-IN-2): GitHub Actions (the SHA pins in
# .github/workflows/, SC-GHA-1) and the Python dependencies locked in uv.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # SC-IN-1: a new release waits a week before it is proposed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
