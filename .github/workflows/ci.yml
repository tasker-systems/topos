name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # It reads only files and the public baseline repository, so this job holds no secret and must
  # not gain one (the witness fails if it does). It needs python3 >= 3.11 and git, both on the runner.
  conventions:
    name: Conventions baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python and git versions
        run: python3 --version && git --version

      - name: Check against the pinned baseline
        run: python3 -I .conventions/baseline/tools/conventions.py check

      - name: Witness — each check refuses a seeded violation
        run: python3 -I .conventions/baseline/tools/conventions.py witness

  # The jobs below install Python and uv from mise.toml through jdx/mise-action, so CI runs the
  # versions a local `mise install` gives, and their Python dependencies from uv.lock.

  # Every example validates against the schemas, and every id and witness path in it resolves.
  examples:
    name: Examples match the schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools (Python, uv)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10

      - name: Check examples
        run: uv run --locked --only-group test python -I tools/check_examples.py

  # Every .py file, from the root ruff.toml (the baseline's canonical configuration, PY-LINT-1).
  python-lint:
    name: Python lint (ruff, every .py)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools (Python, uv)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10

      - name: Lint
        run: uv run --locked --only-group lint ruff check --no-cache .

      - name: Format
        run: uv run --locked --only-group lint ruff format --check --no-cache .

  # The Python tests, including the extractor's, against a real PostgreSQL holding synthetic
  # schemas only. TOPOS_REQUIRE_DATABASE makes a missing server fail rather than skip.
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_PASSWORD: topos-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TOPOS_TEST_DSN: postgresql://postgres:topos-ci@localhost:5432/postgres
      TOPOS_REQUIRE_DATABASE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools (Python, uv)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10

      # --locked fails if uv.lock is not what pyproject.toml resolves to (SC-IN-3).
      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run --locked pytest

  ci-success:
    name: CI Success
    if: always()
    needs: [conventions, examples, python-lint, python-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job passed
        run: |
          test "${{ needs.conventions.result }}" = success
          test "${{ needs.examples.result }}" = success
          test "${{ needs.python-lint.result }}" = success
          test "${{ needs.python-tests.result }}" = success
