[project]
name = "topos"
description = "State what a system allows, and check it against what was intended."
readme = "README.md"
license = "MIT"
# Differs from ruff.toml's py311 target-version until the conventions witness fix lands.
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "pglast>=8.9,<9",
    "psycopg[binary]>=3.3,<4",
    "networkx>=3.7,<4",
]

# Development dependencies, resolved into uv.lock. `uv sync` installs `dev`, which is every group.
[dependency-groups]
test = ["pytest>=9.2,<10", "jsonschema>=4.26,<5"]
lint = ["ruff==0.16.9"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "topos.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# SC-IN-1: resolve only releases at least a week old, matching Dependabot's cooldown.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
